<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="project-id" content="EYOUTH-30909090117044">
  <title>Future Mall | EYOUTH-30909090117044</title>
  <style>
    body {
      margin: 0;
      background-color: #eaf7ff;
      color: #17324d;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #0066cc;
      padding: 24px;
      text-align: center;
    }

    header img {
      width: 130px;
      height: auto;
    }

    h1 {
      margin: 12px 0 0;
      color: white;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .shops {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 0;
      list-style: none;
    }

    .shops li {
      background-color: white;
      border: 2px solid #8ac6ff;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="future_mall_logo.svg" alt="Future Mall logo">
    <h1>Welcome to Future Mall</h1>
  </header>

  <main>
    <p>Future Mall brings fashion, technology, books, food, and gifts together in one friendly place.</p>
    <ul class="shops">
      <li>Future Fashion</li>
      <li>Tech World</li>
      <li>Book Corner</li>
      <li>Sweet Treats</li>
      <li>Gift Galaxy</li>
    </ul>
  </main>
</body>
</html>
