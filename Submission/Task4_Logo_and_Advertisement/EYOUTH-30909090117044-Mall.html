<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Future Mall Grand Opening</title>
  <style>
    body { margin: 0; background: #123055; color: #fff; font-family: Arial, sans-serif; }
    .poster { min-height: 100vh; box-sizing: border-box; padding: 5vw; text-align: center; background: linear-gradient(135deg, #123055 0%, #123055 58%, #00A6A6 58%, #00A6A6 100%); }
    .logo { max-width: 560px; width: 85%; margin: 0 auto 5vh; }
    .badge { display: inline-block; background: #FF6B6B; color: #123055; border-radius: 999px; padding: .7rem 1.3rem; font-weight: bold; letter-spacing: .08em; }
    .opening { font-size: clamp(2.8rem, 9vw, 7rem); margin: .35em 0; font-weight: 800; line-height: .9; }
    .copy { font-size: clamp(1.1rem, 2.5vw, 1.5rem); max-width: 42rem; margin: auto; }
    .date { font-size: clamp(1.7rem, 4vw, 3rem); font-weight: bold; color: #FF6B6B; margin: 1.1em 0; }
    .footer { margin-top: 5vh; font-size: 1rem; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main class="poster">
    <img class="logo" src="future_mall_logo.svg" alt="Future Mall logo">
    <div class="badge">NOW OPENING</div>
    <h1 class="opening">GRAND<br>OPENING</h1>
    <p class="copy">A new place to shop, connect, and enjoy. Welcome to Future Mall.</p>
    <p class="date">15 OCTOBER 2026</p>
    <p class="footer">FUTURE MALL | PORTFOLIO ID: EYOUTH-30909090117044</p>
  </main>
</body>
</html>
